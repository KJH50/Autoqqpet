android.useAndroidX=true
android.enableJetifier=false
# 仓库放在中文路径时 AGP 会直接拒绝构建（Your project path contains non-ASCII characters），
# 这是 AGP 官方给的开关；路径是纯 ASCII 的机器上没影响。
android.overridePathCheck=true
# file.encoding=COMPAT：JDK 18+ 的默认字符集是 UTF-8，而 Windows 的 JDK 启动器读 @argfile
# （测试 worker 的 classpath 文件）时用系统原生编码（简体中文 = GBK）。Gradle 又用 daemon 的默认
# 字符集写这个文件，两边不一致 → 中文路径的 classpath 变成乱码，测试全报 ClassNotFoundException。
# COMPAT = 跟随系统原生编码，Windows 用 GBK、Linux/macOS 用 UTF-8，两个方向自动对齐。
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=COMPAT
kotlin.code.style=official
# 首次构建若无网络，可加 org.gradle.offline=true 视缓存情况

# R8 全模式（只裁剪/优化；源码公开版不混淆，见 proguard-rules.pro 的 -dontobfuscate）
android.enableR8.fullMode=true
# 并行构建 + 构建缓存，缩短本地打包时间
org.gradle.parallel=true
org.gradle.caching=true
